name: Build Iron

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            cmake \
            ninja-build \
            libglib2.0-dev \
            libnss3-dev \
            libnspr4-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdrm-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxrandr-dev \
            libgbm-dev \
            libx11-dev \
            libxext-dev \
            libegl1-mesa-dev \
            patchelf \
            jq

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build (release)
        run: cargo build --release --no-default-features 2>&1 | tee build.log

      - name: Set rpath and verify binary
        run: |
          BINARY="target/release/iron"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found"
            exit 1
          fi
          patchelf --set-rpath '$ORIGIN:$ORIGIN/../lib:$ORIGIN/lib' "$BINARY" 2>/dev/null || \
            patchelf --set-rpath '\$ORIGIN:\$ORIGIN/../lib:\$ORIGIN/lib' "$BINARY" || true
          echo "RPATH in binary:"
          readelf -d "$BINARY" 2>/dev/null | grep -E 'RPATH|RUNPATH' || echo "WARNING: No RPATH/RUNPATH found"
          SIZE=$(stat -c%s "$BINARY")
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Binary too small ($SIZE bytes)"
            exit 1
          fi
          echo "Build successful!"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: iron-release
          path: target/release/iron
          if-no-files-found: error
          retention-days: 5

      - name: Compute new tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: tag
        run: |
          git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=$(echo "$PREV_TAG" | sed 's/^v//')
          MAJOR=$(echo "$VERSION" | cut -d. -f1 | sed 's/^0*//')
          MINOR=$(echo "$VERSION" | cut -d. -f2 | sed 's/^0*//')
          PATCH=$(echo "$VERSION" | cut -d. -f3 | sed 's/^0*//')
          [ -z "$MAJOR" ] && MAJOR=0
          [ -z "$MINOR" ] && MINOR=0
          [ -z "$PATCH" ] && PATCH=0
          while git rev-parse "v${MAJOR}.${MINOR}.${PATCH}" >/dev/null 2>&1; do
            PATCH=$((10#$PATCH + 1))
          done
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Update Cargo.toml version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          NEW_TAG="${{ steps.tag.outputs.new_tag }}"
          VERSION="${NEW_TAG#v}"
          awk -F'= ' '/^\[package\]/{p=1} p && /^version/{gsub(/"[^"]+"/,"\"'"$VERSION"'\""); p=0} 1' Cargo.toml > tmp && mv tmp Cargo.toml
          git add Cargo.toml
          git config --global user.email "iron-bot@akinus21.com"
          git config --global user.name "Iron Bot"
          git commit -m "chore: bump version to ${VERSION}"
        env:
          GIT_AUTHOR_NAME: Iron Bot
          GIT_AUTHOR_EMAIL: iron-bot@akinus21.com
          GIT_COMMITTER_NAME: Iron Bot
          GIT_COMMITTER_EMAIL: iron-bot@akinus21.com

      - name: Tag and create GitHub release with binary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "iron-bot@akinus21.com"
          git config --global user.name "Iron Bot"

          NEW_TAG="${{ steps.tag.outputs.new_tag }}"
          BINARY="target/release/iron"

          if [ ! -s "$BINARY" ]; then
            echo "ERROR: Binary missing or empty at $BINARY"
            exit 1
          fi

          SHA256=$(sha256sum "$BINARY" | awk '{print $1}')
          SIZE=$(stat -c%s "$BINARY")
          echo "Binary size: $SIZE bytes"
          echo "SHA256: $SHA256"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Binary too small"
            exit 1
          fi

          CEF_RUNTIME_SHA256=""
          CEF_DIR=""

          is_cef_runtime_dir() {
            local dir="$1"
            [ -n "$dir" ] || return 1
            [ -f "$dir/libcef.so" ] || return 1
            [ -f "$dir/icudtl.dat" ] || return 1
            [ -d "$dir/locales" ] || return 1
            return 0
          }

          CANDIDATES=()
          # Use only runtimes from cef-dll-sys build outputs to avoid ABI mismatches.
          while IFS= read -r dir; do CANDIDATES+=("$dir"); done < <(find target/release/build -path "*cef-dll-sys*" -name "libcef.so" -printf '%h\n' 2>/dev/null)
          while IFS= read -r dir; do CANDIDATES+=("$dir"); done < <(find target/debug/build -path "*cef-dll-sys*" -name "libcef.so" -printf '%h\n' 2>/dev/null)

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "ERROR: no cef-dll-sys runtime candidates found in target/*/build"
            find target -path "*cef-dll-sys*" -maxdepth 6 -type f | head -50
            exit 1
          fi

          for dir in "${CANDIDATES[@]}"; do
            case "$dir" in
              /home/linuxbrew/.linuxbrew/*|/usr/lib*|/usr/local/lib*)
                continue
                ;;
            esac
            if is_cef_runtime_dir "$dir"; then
              CEF_DIR="$dir"
              break
            fi
          done

          if [ -n "$CEF_DIR" ] && is_cef_runtime_dir "$CEF_DIR"; then
            echo "Found CEF runtime at: $CEF_DIR"
            # Copy libcef.so next to the binary for $ORIGIN rpath (skip if already there)
            if [ "$(readlink -f "$CEF_DIR/libcef.so")" != "$(readlink -f "target/release/libcef.so" 2>/dev/null || echo "")" ]; then
              cp "$CEF_DIR/libcef.so" target/release/
            fi
            # Create CEF runtime tarball from the found directory
            cd "$CEF_DIR"
            echo "CEF runtime files:"
            ls -la "$CEF_DIR/" | head -30
            echo "Contents of locales:"
            ls -la "$CEF_DIR/locales/" 2>/dev/null | head -10
            shopt -s nullglob
            RUNTIME_FILES=(libcef.so icudtl.dat *.pak *.bin)
            [ -f libEGL.so ] && RUNTIME_FILES+=(libEGL.so)
            [ -f libGLESv2.so ] && RUNTIME_FILES+=(libGLESv2.so)
            [ -f libvk_swiftshader.so ] && RUNTIME_FILES+=(libvk_swiftshader.so)
            [ -f vk_swiftshader_icd.json ] && RUNTIME_FILES+=(vk_swiftshader_icd.json)
            [ -d locales ] && RUNTIME_FILES+=(locales)
            [ -d swiftshader ] && RUNTIME_FILES+=(swiftshader)
            tar czf "$GITHUB_WORKSPACE/cef-runtime.tar.gz" "${RUNTIME_FILES[@]}"
            cd "$GITHUB_WORKSPACE"
            echo "Tarball contents:"
            tar tzf cef-runtime.tar.gz | head -20
            CEF_RUNTIME_SHA256=$(sha256sum cef-runtime.tar.gz | awk '{print $1}')
            echo "CEF runtime tarball SHA256: $CEF_RUNTIME_SHA256"
            echo "CEF runtime tarball size: $(stat -c%s cef-runtime.tar.gz) bytes"
          else
            echo "ERROR: no complete CEF runtime directory found"
            find / -name "libcef.so" 2>/dev/null | head -20
            exit 1
          fi

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          if [ -f cef-runtime.tar.gz ]; then
            gh release create "$NEW_TAG" \
              --title "$NEW_TAG" \
              --notes "" \
              "$BINARY#iron" \
              "cef-runtime.tar.gz#cef-runtime"
          else
            gh release create "$NEW_TAG" \
              --title "$NEW_TAG" \
              --notes "" \
              "$BINARY#iron"
          fi

          ASSET_COUNT=$(gh release view "$NEW_TAG" --json assets --jq '.assets | length')
          echo "Assets uploaded: $ASSET_COUNT"
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "cef_runtime_sha256=$CEF_RUNTIME_SHA256" >> $GITHUB_OUTPUT

      - name: Update homebrew tap
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "iron-bot@akinus21.com"
          git config --global user.name "Iron Bot"

          NEW_TAG="${{ steps.tag.outputs.new_tag }}"
          SHA256="${{ steps.release.outputs.sha256 }}"
          CEF_RUNTIME_SHA256="${{ steps.release.outputs.cef_runtime_sha256 }}"
          BINARY_URL="https://github.com/Akinus21/Iron/releases/download/${NEW_TAG}/iron"
          CEF_RUNTIME_URL="https://github.com/Akinus21/Iron/releases/download/${NEW_TAG}/cef-runtime.tar.gz"

          TAP_REPO="Akinus21/homebrew-tap"
          TAP_DIR="/tmp/homebrew-tap"

          rm -rf "$TAP_DIR"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          cd "$TAP_DIR"

          mkdir -p Formula

          export IRON_VERSION="${NEW_TAG#v}"

          sed -e "s|{{VERSION}}|${IRON_VERSION}|g" \
              -e "s|{{URL}}|${BINARY_URL}|g" \
              -e "s|{{SHA256}}|${SHA256}|g" \
              -e "s|{{CEF_RUNTIME_URL}}|${CEF_RUNTIME_URL}|g" \
              -e "s|{{CEF_RUNTIME_SHA256}}|${CEF_RUNTIME_SHA256}|g" \
              "$GITHUB_WORKSPACE/.github/workflows/iron_formula.tpl" > Formula/iron.rb

          git add Formula/iron.rb
          git commit -m "Update iron to ${NEW_TAG}"
          git push origin master

      - name: Notify webhook on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_HMAC_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" "$SHA" 2>/dev/null || echo "unknown")
          ERRORS=$(tail -n 200 build.log | jq -Rs .)

          PAYLOAD=$(jq -cn \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHA" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg ref "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg errors "$ERRORS" \
            '{run_url:$run_url,sha:$sha,commit_msg:$commit_msg,ref:$ref,actor:$actor,errors:$errors}')

          SIG=$(printf '%s' "$PAYLOAD" | \
            openssl dgst -sha256 -hmac "$WEBHOOK_HMAC_SECRET" | \
            awk '{print "sha256="$2}')

          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: build_failure" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD" \
            "https://webhook.akinus21.com/webhook/iron-build" || true

      - name: Notify webhook on success
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WEBHOOK_HMAC_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" "$SHA" 2>/dev/null || echo "unknown")

          PAYLOAD=$(jq -cn \
            --arg event "build_success" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHA" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg ref "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            '{event:$event,run_url:$run_url,sha:$sha,commit_msg:$commit_msg,ref:$ref,actor:$actor}')

          SIG=$(printf '%s' "$PAYLOAD" | \
            openssl dgst -sha256 -hmac "$WEBHOOK_HMAC_SECRET" | \
            awk '{print "sha256="$2}')

          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: build_success" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD" \
            "https://webhook.akinus21.com/webhook/iron-build" || true
