name: Build Iron

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            cmake \
            ninja-build \
            libglib2.0-dev \
            libnss3-dev \
            libnspr4-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdrm-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxrandr-dev \
            libgbm-dev \
            libx11-dev \
            libxext-dev \
            libegl1-mesa-dev

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

- name: Build (release)
      run: cargo build --release --no-default-features 2>&1 | tee build.log

      - name: Verify binary exists
        run: |
          if [ ! -f target/release/iron ]; then
            echo "ERROR: Binary not found at target/release/iron"
            exit 1
          fi
          SIZE=$(stat -c%s target/release/iron)
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Binary too small ($SIZE bytes)"
            exit 1
          fi
          echo "Build successful!"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: iron-release
          path: target/release/iron
          if-no-files-found: error
          retention-days: 5