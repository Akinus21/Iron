[package]
name = "iron"
version = "0.0.94"
edition = "2021"
description = "A GTK4 keyboard-driven web browser for BlueAK"
license = "MIT"
repository = "https://github.com/Akinus21/Iron"

[dependencies]
adw = { package = "libadwaita", version = "0.5" }
gtk4 = "0.7"
gdk4 = "0.7"
glib = "0.18"
gio = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml = "0.8"
urlencoding = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
cef = "148.0.0"
x11 = "2.21"
once_cell = "1.19"

[features]
default = ["cef-stub"]
cef-stub = []
